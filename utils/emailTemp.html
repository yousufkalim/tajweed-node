<body style="margin: 0; padding: 0">
  <table
    role="presentation"
    style="
      width: 100%;
      border-collapse: collapse;
      border: 0;
      border-spacing: 0;
      background: #ffffff;
    "
  >
    <tr>
      <td align="center" style="padding: 0">
        <table
          role="presentation"
          style="
            width: 602px;
            border-collapse: collapse;
            border: 1px solid #cccccc;
            border-spacing: 0;
            text-align: left;
          "
        >
          <tr>
            <td
              align="center"
              style="padding: 20px 5px 10px 5px; background: rgba(158, 219, 171, 0.1)"
            >
              <span style="color: #47b45f;
              font-size: 42px;
              font-family: fantasy;
              letter-spacing: 0;
              line-height: 42px;
              text-align: left;">Tajweed.</span>
              <h2 style="
              font-family: Verdana; color: #47B45F; ">
                Assalam O Alikum!
              </h2>
              <h4 style="font-family: Verdana; color: #787878;">
                OTP for your request is below
              </h4>
            </td>
          </tr>
          <tr>
            <td
              align="center"
              style="
                padding: 20px 10px 20px 10px;
                background: rgba(158, 219, 171, 0.3);
              "
            >
            <div style="width: 50%;">
              <h3
                style="
                  font-family: Verdana;
                  font-size: 35px;
                  background-color: #47B45F;
                  padding: 2%;
                  color: #F3FFF7;
                  border-radius: 10px;
                "
              >
                ${otp}
              </h3>
              </div>
              <p align="center" style="
                  font-family: Verdana;
                  color: #787878;">
                If you haven't sent this opt, please ignore this message.
              </p>
            </td>
          </tr>
          <tr>
            <td>
              <p align="center" style="color: #000; font-family: Verdana">
                This email is generated automatically please do not reply.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
