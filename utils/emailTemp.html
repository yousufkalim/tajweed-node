<body style="margin: 0; padding: 0">
  <table
    role="presentation"
    style="
      width: 100%;

      border: 0;

      <td align="center" style="padding: 0">
        <table
          role="presentation"

            text-align: left;
          "
        >

                width="150px"
                style="height: auto; display: block"
              />

                Assalam O Alikum! Brother, Your OTP is below

            >

                style="

                  font-size: 35px;

                  padding: 2%;

          </tr>
          <tr>

              </p>

        </table>
